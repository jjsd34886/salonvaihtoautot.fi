<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg8" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="sun8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg8)"/>
  <!-- Sun rays -->
  <g opacity="0.7" stroke="#78350f" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="12"/>
    <line x1="32" y1="52" x2="32" y2="60"/>
    <line x1="4" y1="32" x2="12" y2="32"/>
    <line x1="52" y1="32" x2="60" y2="32"/>
    <line x1="11" y1="11" x2="17" y2="17"/>
    <line x1="47" y1="47" x2="53" y2="53"/>
    <line x1="53" y1="11" x2="47" y2="17"/>
    <line x1="17" y1="47" x2="11" y2="53"/>
  </g>
  <!-- Sun core -->
  <circle cx="32" cy="32" r="16" fill="url(#sun8)"/>
  <circle cx="32" cy="32" r="13" fill="#ffffff" opacity="0.5"/>
  <!-- B letter for Brite -->
  <text x="32" y="39" font-family="Georgia, serif" font-size="22" font-weight="900" fill="#92400e" text-anchor="middle">B</text>
</svg>
